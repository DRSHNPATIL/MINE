<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRSHN</title>
</head>
<body>
    <form action="welcome.html" target="_blank">
    
    <hr>
    <header>
        <h3> Registration Form </h3>
    </header>
    <hr>
    
      <form>
         <label>Full Name:</label><br>
          <input type="text" placeholder="Enter your name">
        <br><br>
         <label>Email Id:</label><br>
          <input type="email" placeholder="Enter your Email Id">
        <br><br>
         <label>Roll No:</label><br>
          <input type="Roll number" placeholder=" Enter your Roll No.">
        <br><br>
         <label>Password:</label><br>
          <input type="password" placeholder="Enter your Password">
        <br><br>
        
         <label>Gender:</label><br>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female"> Female
          <input type="radio" name="gender" value="ther"> Other
        <br><br>

         <label>Date of Birth:</label><br>
          <input type="date" name="dob">
        <br><br>

         <label>Selct your city:</label>
          <select name="city">
            <option>Jalgaon</option>
            <option>Pune</option>
            <option>Mumbai</option>
            <option>Nashik</option>
          </select>
        <br><br>
        
         <label>Address:</label><br>
          <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

         <input type="checkbox">
           I agree Terms and Conditions
        <br><br>

         <input type="Submit" value="Register">
         <input type="Reset" value="Clear">
      </form>
      <hr>
</body>
</html>
